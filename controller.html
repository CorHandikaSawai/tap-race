<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tap Race Controller</title>
        <script type="text/javascript" src="https://www.airconsole.com/api/airconsole-1.10.0.js"></script>
        <script type="text/javascript" src="js/controller.js" defer></script>
    </head>
    <body>
        <button id="tapButton">Tap Me!</button>
        <button id="readyButton">Ready </button>
        <div id="goalSelector" style="display: none;">
            <button id="setGoalButton30">30</button>
            <button id="setGoalButton50">50</button>
            <button id="setGoalButton100">100</button>
        </div>
        <button id="playAgainButton" style="display: none;">Play Again</button>
    </body>
</html>
